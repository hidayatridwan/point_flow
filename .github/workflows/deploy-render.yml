name: Deploy to Render

# ALUR BARU: build image di Actions -> push ke Docker Hub -> apply migrasi ke
# Supabase -> trigger deploy Render lewat deploy hook (image-backed service,
# tidak auto-deploy dari tag `latest`, jadi hook wajib dipanggil).
#
# Trigger-nya manual (workflow_dispatch) agar sepenuhnya terpisah dari jalur
# CI lama. Jalur GHCR -> VPS di deploy-backend.yml sudah non-aktif karena
# VPS dimatikan; file itu tetap ada untuk referensi.
#
# Secrets yang harus diisi di repo (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME     — username Docker Hub
#   DOCKERHUB_TOKEN        — access token Docker Hub (push + Render pull)
#   SUPABASE_DATABASE_URL  — connection string session pooler Supabase
#                            (aws-0-<region>.pooler.supabase.com:5432, plus
#                            ?sslmode=require)
#   RENDER_DEPLOY_HOOK     — deploy hook URL service Render
#                            (Settings -> Deploy hook), dari dashboard Render

on:
  workflow_dispatch:
    inputs:
      apply_seeds:
        description: "Juga jalankan backend/seeds/dashboard_sample.sql (contoh data, tidak idempotent)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-render
  cancel-in-progress: false

env:
  IMAGE: point-flow

jobs:
  push-image:
    name: Build & Push Image ke Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Render mewajibkan image ber-platform linux/amd64 (deploy-an-image docs),
      # jadi platform ini di-pin secara eksplisit.
      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Apply Migrations ke Supabase
    runs-on: ubuntu-latest
    needs: push-image
    steps:
      - uses: actions/checkout@v4

      - name: Ensure psql is available
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi

      # Migrasi dijalankan satu file per transaksi sesuai urutan nama file.
      # Tabel _point_flow_schema_migrations mencatat file yang sudah jalan,
      # sehingga deploy berikutnya tidak menjalankan ulang (CREATE TABLE tanpa
      # IF NOT EXISTS akan gagal kalau dijalankan dobel).
      - name: Apply pending migrations in order
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE IF NOT EXISTS _point_flow_schema_migrations (name text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())"

          for f in backend/migrations/*.sql; do
            name="$(basename "$f")"
            applied="$(psql "$DATABASE_URL" -tA -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM _point_flow_schema_migrations WHERE name = '$name'")"
            if [ "$applied" = "1" ]; then
              echo "== $name -> sudah diterapkan, skip"
            else
              echo "== $name -> diterapkan..."
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$f"
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO _point_flow_schema_migrations (name) VALUES ('$name')"
            fi
          done

          psql "$DATABASE_URL" -tA -v ON_ERROR_STOP=1 -c "SELECT 'total applied: ' || count(*) FROM _point_flow_schema_migrations"

      # Optional: contoh data dashboard. Tidak idempotent — hanya centang saat
      # benar-benar mau seed, biasanya sekali saja di awal.
      - name: Apply dashboard_sample seed (optional)
        if: ${{ inputs.apply_seeds }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/seeds/dashboard_sample.sql

      - name: Verify health of migrated schema
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -tA -v ON_ERROR_STOP=1 -c \
            "SELECT 'tables: ' || count(*) FROM information_schema.tables WHERE table_schema = 'public'"

  deploy:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest
    needs: migrate
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      # Bila secret belum diisi (service Render belum dibuat), step ini dilewati
      # agar run pertama tetap hijau: image sudah ter-push & migrasi sudah
      # diterapkan. Setelah service dibuat + secret diisi, jalankan ulang workflow.
      - name: Deploy image terbaru
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: |
          IMG_URL="docker.io/${DOCKERHUB_USERNAME}/${IMAGE}:latest"
          ENC_IMG_URL="$(printf '%s' "$IMG_URL" | jq -sRr @uri)"
          echo "== Trigger render deploy untuk ${IMG_URL}"
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK}&imgURL=${ENC_IMG_URL}"

      - name: RENDER_DEPLOY_HOOK belum diset (skip trigger)
        if: ${{ env.RENDER_DEPLOY_HOOK == '' }}
        run: |
          echo "::warning::RENDER_DEPLOY_HOOK kosong. Image & migrasi sudah selesai di job atas."
          echo "::warning::Setelah service Render dibuat: isi secret RENDER_DEPLOY_HOOK, lalu run ulang workflow ini (atau pakai 'Manual Deploy > Deploy latest reference' di dashboard Render)."
