name: Deploy Frontend (Hostinger FTP)

# Build frontend statis (SvelteKit adapter-static) lalu upload via FTPS ke
# shared hosting Hostinger — folder subdomain dash-pointflow.adityaramadc.com
# (dan pointflow.adityaramadc.com, keduanya menunjuk folder yang sama).
#
# Secrets yang wajib dibuat di GitHub Settings → Secrets and variables → Actions:
#   FTP_HOST                — ftp.adityaramadc.com (tanpa scheme/port)
#   FTP_USERNAME            — u178308632.pointflow (dengan prefix akun utama)
#   FTP_PASSWORD            — password akun FTP
#   PUBLIC_API_BASE_URL     — mis. https://point-flow.fly.dev/api/v1
#   PUBLIC_MIDTRANS_CLIENT_KEY — (opsional) client key dashboard Midtrans
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  deploy:
    name: Build & upload via FTPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: frontend
        env:
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
          PUBLIC_MIDTRANS_CLIENT_KEY: ${{ secrets.PUBLIC_MIDTRANS_CLIENT_KEY }}
          PUBLIC_MIDTRANS_IS_PRODUCTION: 'false'
        run: bun run build

      # adapter-static menyalin isi frontend/static/ (termasuk .htaccess SPA
      # fallback) ke frontend/build/, jadi cukup upload satu folder ini.

      # Bersihkan nilai FTP_HOST dari format panjang ala hPanel:
      # "ftp://156.67.222.114" atau "ftps://host/path" → "156.67.222.114".
      - name: Normalize FTP host
        id: ftp-host
        run: |
          host="${FTP_HOST#ftp://}"
          host="${host#ftps://}"
          host="${host%%/*}"
          host="$(echo "$host" | xargs)" # buang spasi/newline tempelan
          echo "host=$host" >> "$GITHUB_OUTPUT"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}

      - name: Upload ke Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.3
        with:
          server: ${{ steps.ftp-host.outputs.host }}
          port: 21
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # PENTING: akun FTP "u178308632.pointflow" di-jaile ke
          # /home/u178308632/domains/adityaramadc.com/public_html,
          # jadi folder situs pointflow relatif dari root FTP = /pointflow/
          server-dir: /pointflow/
          local-dir: frontend/build/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
