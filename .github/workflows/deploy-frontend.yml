name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'netlify.toml'

jobs:
  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID_SHOP: ${{ secrets.NETLIFY_SITE_ID_SHOP }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install

      - name: Build
        working-directory: frontend
        env:
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
        run: bun run build

      - name: Deploy dashboard kasir ke Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=frontend/build --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # Situs storefront (deploy kedua dengan build yang sama). Step ini
      # ter-skip sampai secret NETLIFY_SITE_ID_SHOP dibuat — lihat README
      # bagian "Dua situs Netlify: kasir vs storefront".
      - name: Deploy storefront ke Netlify
        if: env.NETLIFY_SITE_ID_SHOP != ''
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=frontend/build --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_SHOP }}
