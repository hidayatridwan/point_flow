# JALUR LAMA (GHCR -> VPS). VPS sudah dimatikan; trigger push dipindah ke
# manual-only supaya tidak gagal di setiap push ke main. Deploy backend sekarang
# lewat .github/workflows/deploy-render.yml (Render + Supabase).
# Workflow ini tetap disimpan untuk referensi / mengaktifkan VPS lagi nanti.

name: Deploy Backend

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/point_flow:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      # Copy ONLY the runtime artifacts to the VPS — no source, no .git.
      # The backend itself ships as the prebuilt GHCR image (pulled by deploy.sh);
      # the SQL dirs are required because docker-compose.prod.yml bind-mounts them
      # read-only for manual migrations/seeding.
      - name: Copy deploy artifacts to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,deploy.sh,backend/migrations,backend/seeds"
          target: "~/app"

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd ~/app
            chmod +x deploy.sh
            export VAULT_TOKEN="${{ secrets.VAULT_TOKEN }}"
            export GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            ./deploy.sh
