name: point_flow

x-logging: &point_flow-backend-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: ghcr.io/hidayatridwan/point_flow-backend:latest
    container_name: point_flow-backend
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8081}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      REFRESH_TOKEN_COOKIE_NAME: ${REFRESH_TOKEN_COOKIE_NAME:-refresh_token}
      REFRESH_TOKEN_COOKIE_SECURE: ${REFRESH_TOKEN_COOKIE_SECURE:-true}
      REFRESH_TOKEN_COOKIE_SAME_SITE: ${REFRESH_TOKEN_COOKIE_SAME_SITE:-None}
      REFRESH_TOKEN_COOKIE_DOMAIN: ${REFRESH_TOKEN_COOKIE_DOMAIN:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:${APP_PORT:-8081}"
    networks:
      - default
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
    logging: *point_flow-backend-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${APP_PORT}/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: point_flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # Database lives on a host directory OUTSIDE ~/app, so it survives
      # `docker compose down -v` / volume deletion and is never touched by the
      # deploy artifact sync. Override POSTGRES_DATA_DIR to relocate it.
      - ${POSTGRES_DATA_DIR:-/srv/point_flow/postgres}:/var/lib/postgresql/data
      # Schema + seed SQL mounted read-only for manual runs, e.g.:
      #   docker exec point_flow-postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f /sql/seeds/dashboard_sample.sql
      # NOTE: these are NOT auto-applied on init (that only happens via
      # /docker-entrypoint-initdb.d, which we intentionally do not use in prod).
      - ./backend/migrations:/sql/migrations:ro
      - ./backend/seeds:/sql/seeds:ro
    logging: *point_flow-backend-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default: {}
  # The Caddy reverse proxy lives on the external 'web' network; point_flow-backend joins
  # it so Caddy can reach the container by name (reverse_proxy point_flow-backend:8081).
  proxy:
    external: true
    name: web
