[build]
base = "frontend"
command = "bun run build"
publish = "build"

[build.environment]
PUBLIC_API_BASE_URL = "https://point-flow-latest.onrender.com/api/v1"

# SPA fallback: serve the client-rendered shell for any path that isn't a real
# file (e.g. /dashboard on a hard refresh). Real assets are matched first, so
# this only catches client-side routes.
[[redirects]]
from = "/*"
to = "/200.html"
status = 200
