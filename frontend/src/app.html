<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(() => {
				let theme = null;

				try {
					const storedTheme = localStorage.getItem('theme');
					theme = storedTheme === 'dark' || storedTheme === 'light' ? storedTheme : null;
				} catch {
					theme = null;
				}

				const systemPrefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
				const shouldUseDark = theme === 'dark' || (!theme && systemPrefersDark);

				document.documentElement.classList.toggle('dark', shouldUseDark);

				try {
					const storedLocale = localStorage.getItem('locale');
					document.documentElement.lang =
						storedLocale === 'id' || storedLocale === 'en' ? storedLocale : 'id';
				} catch {
					document.documentElement.lang = 'id';
				}
			})();
		</script>
		<script>
			// Netlify menyisipkan badge "Powered by Netlify" lewat script
			// /.netlify/scripts/hud yang merender <div class="nl-wrap"> di dalam
			// iframe #nl-badge-frame. Div itu terisolasi di frame-nya sehingga tidak
			// bisa dijangkau JS halaman, jadi yang dibuang adalah frame-nya —
			// setelah seluruh HTML, CSS, dan JS halaman selesai dimuat (event
			// `load`), lalu buang juga bila frame disisipkan ulang belakangan.
			(() => {
				const removeNetlifyBadge = () => {
					document
						.querySelectorAll('#nl-badge-frame, .nl-wrap')
						.forEach((el) => el.remove());
				};

				window.addEventListener('load', removeNetlifyBadge, { once: true });

				new MutationObserver((mutations) => {
					for (const mutation of mutations) {
						for (const node of mutation.addedNodes) {
							if (
								node.nodeType === Node.ELEMENT_NODE &&
								(node.id === 'nl-badge-frame' ||
									node.classList?.contains('nl-wrap') ||
									node.querySelector?.('#nl-badge-frame, .nl-wrap'))
							) {
								removeNetlifyBadge();
								return;
							}
						}
					}
				}).observe(document.documentElement, { childList: true, subtree: true });
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
